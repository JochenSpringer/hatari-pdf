name: Windows-Build
on:
  workflow_dispatch:
  push:

jobs:
  win64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Eigene Dateien holen
        uses: actions/checkout@v4
      - name: Hatari 2.6.1 holen
        uses: actions/checkout@v4
        with:
          repository: hatari/hatari
          ref: v2.6.1
          path: hatari-src
      - name: Werkzeuge installieren
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make git
            mingw-w64-x86_64-cmake mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libpng mingw-w64-x86_64-portmidi
      - name: Hatari mit PDF-Drucker bauen
        run: |
          chmod +x build-windows.sh
          ./build-windows.sh "$PWD/hatari-src"
      - name: prn2pdf.exe bauen
        run: |
          gcc -std=gnu99 -O2 -s -DPE_HAVE_ZLIB \
            -Isrc/pe/include -Isrc/pe/src -Isrc/pe/src/drivers \
            src/pe/src/*.c src/pe/src/drivers/*.c src/pe/src/fonts/*.c \
            tools/prn2pdf.c -lz -static -o dist/prn2pdf.exe
      - name: Ergebnis bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: hatari-win64
          path: dist/
